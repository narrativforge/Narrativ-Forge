name: The Nexus Suite - Cloud Heartbeat & Keep-Alive

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

concurrency:
  group: nexus-heartbeat-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  heartbeat:
    name: Ping All Nexus Ecosystem Targets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping All 18 Nexus Targets (Render, Supabase, Vercel)
        shell: bash
        run: |
          set -u

          TARGETS=(
            "https://narrativ-forge.onrender.com/health"
            "https://auracraft-backend-dt1u.onrender.com/health"
            "https://logixa-flow.onrender.com/health"
            "https://cognix-core-ypak.onrender.com/health"
            "https://doka-ai-dms.logixaflow.workers.dev/health"
            "https://a-little-world-with-us.vercel.app/api/health"
            "https://narrativ-forge.vercel.app"
            "https://auracraft-studio.vercel.app"
            "https://logixa-flow.vercel.app"
            "https://cognix-nexus.vercel.app"
            "https://doka-ai-dms.vercel.app"
            "https://a-little-world-with-us.vercel.app"
            "https://xrhlefglqwquhvpoevsg.supabase.co/rest/v1/"
            "https://nhmzyaawwbibnbtxoajd.supabase.co/rest/v1/"
            "https://ephrnmigiwjhdjksreos.supabase.co/rest/v1/"
            "https://jarfusheiqkfcbeljvhj.supabase.co/rest/v1/"
            "https://jkobgssaqifzrqfirdfu.supabase.co/rest/v1/"
            "https://mktfnwdvzbdrxfcvnolp.supabase.co/rest/v1/"
          )

          echo "======================================================="
          echo " Starting Cloud Heartbeat for The Nexus Suite (18 Targets)"
          echo "======================================================="
          
          failures=0
          for url in "${TARGETS[@]}"; do
            echo -n "Pinging $url ... "
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            if [[ "$code" == "200" || "$code" == "401" || "$code" == "308" || "$code" == "307" || "$code" == "302" ]]; then
              echo "✅ HTTP $code"
            else
              echo "⚠️ HTTP $code (Retrying once)"
              sleep 2
              code2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$url" || echo "000")
              if [[ "$code2" == "200" || "$code2" == "401" || "$code2" == "308" || "$code2" == "307" || "$code2" == "302" ]]; then
                echo "  ✅ Retry succeeded: HTTP $code2"
              else
                echo "  ❌ Failed: HTTP $code2"
                failures=$((failures + 1))
              fi
            fi
          done

          echo "======================================================="
          echo " Heartbeat Completed. Failures: $failures / ${#TARGETS[@]}"
          echo "======================================================="
          if [[ $failures -gt 0 ]]; then
            echo "Notice: $failures target(s) did not return 200/401."
          fi
